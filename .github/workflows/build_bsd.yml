name: Build FreeBSD Release

on:
  workflow_dispatch:
  push:
    branches:
      - alpha
      - beta
      - main
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'assets/**'
      - 'configs/**'
      - 'scripts/install_bsd.sh'
      - 'main.spec'
      - 'pyproject.toml'
      - '.github/workflows/build_bsd.yml'

jobs:
  build-freebsd:
    name: Build FreeBSD 10 (GhostBSD 4.x compatible) x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare PyInstaller source on host runner
        run: |
          mkdir -p .cache/build
          pip download --no-deps "pyinstaller==3.3.1" "future==0.16.0" "altgraph==0.15" "macholib==1.9" "pefile==2017.11.5" -d .cache/build/

      - name: Build in FreeBSD 10 VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: '10.4'
          usesh: true
          prepare: |
            export ASSUME_ALWAYS_YES=yes
            export PACKAGESITE="http://mirror.sg.gs/freebsd-pkg/FreeBSD:10:amd64/latest"

            # 1. Direct configuration to HTTP mirror to avoid expired Let's Encrypt CA validation on ancient FreeBSD 10
            mkdir -p /usr/local/etc/pkg/repos /etc/pkg
            sed -i '' -e 's|https://|http://|g' /etc/pkg/*.conf 2>/dev/null || true
            printf 'FreeBSD: {\n  url: "http://mirror.sg.gs/freebsd-pkg/${ABI}/latest",\n  mirror_type: "none",\n  signature_type: "none",\n  enabled: yes\n}\n' > /usr/local/etc/pkg/repos/FreeBSD.conf

            # 2. Extract pkg directly if missing
            if ! command -v pkg >/dev/null 2>&1; then
              fetch -o /tmp/pkg.txz http://mirror.sg.gs/freebsd-pkg/FreeBSD:10:amd64/latest/Latest/pkg.txz || true
              if [ -f /tmp/pkg.txz ]; then
                tar -xf /tmp/pkg.txz -C / || true
              fi
            fi

            # 3. Update catalogue over HTTP
            pkg update -f || true

            # 4. Install Python 3.6 and PyQt4 / PyQt5 packages from FreeBSD 10 repo
            pkg install -y python36 py36-setuptools py36-qt4 py36-qt4-gui py36-qt4-core py36-qt4-svg || \
            pkg install -y python36 py36-setuptools py36-qt5 py36-qt5-gui py36-qt5-core py36-qt5-widgets py36-qt5-svg || true

            # Symlink python3 and python to installed Python 3.6
            for p in /usr/local/bin/python3.6 /usr/local/bin/python3.5 /usr/local/bin/python3.4 /usr/local/bin/python3; do
              if [ -f "$p" ]; then
                ln -sf "$p" /usr/local/bin/python3
                ln -sf "$p" /usr/local/bin/python
                break
              fi
            done

            # 5. Install PyInstaller 3.3.1 offline from downloaded tarball and wheels
            python3 -c "import zipfile, glob, os; target = '/usr/local/lib/python3.6/site-packages'; [zipfile.ZipFile(w).extractall(target) for w in glob.glob('.cache/build/*.whl') if not any(k in os.path.basename(w) for k in ('setuptools', 'wheel', 'pip'))]"
            for pkg in future-0.16.0 pefile-2017.11.5 PyInstaller-3.3.1; do
              if [ -f .cache/build/${pkg}.tar.gz ]; then
                tar -xzf .cache/build/${pkg}.tar.gz -C /tmp/
                (cd /tmp/${pkg} && python3 setup.py install)
              fi
            done
          run: |
            set -e

            # 1. Compile single-file portable binary
            python3 -m PyInstaller main.spec --noconfirm --clean

            # 2. Verify binary existence and permissions
            if [ ! -f "dist/Atlas-x86_64-Portable" ]; then
              echo "Build failure: dist/Atlas-x86_64-Portable was not generated." >&2
              exit 1
            fi
            chmod +x dist/Atlas-x86_64-Portable

            # 3. Stage the portable release bundle
            rm -rf dist/FreeBSD_Release
            mkdir -p dist/FreeBSD_Release
            cp -p dist/Atlas-x86_64-Portable dist/FreeBSD_Release/
            cp -p assets/icons/Icon.svg dist/FreeBSD_Release/
            cp -p scripts/install_bsd.sh dist/FreeBSD_Release/
            chmod +x dist/FreeBSD_Release/install_bsd.sh

            # 4. Package as compressed tar archive (matching GhostBSD release structure)
            cd dist
            tar -czvf FreeBSD_Release.tar.gz FreeBSD_Release/
            cp FreeBSD_Release.tar.gz Atlas-FreeBSD10-x86_64.tar.gz

      - name: Upload FreeBSD Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-FreeBSD10-GhostBSD4-x86_64
          path: |
            dist/FreeBSD_Release.tar.gz
            dist/Atlas-FreeBSD10-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14
