name: Build Linux Release

on:
  workflow_dispatch:
  push:
    branches:
      - alpha
      - beta
      - main
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'assets/**'
      - 'configs/**'
      - 'installer/appimage/**'
      - 'installer/debian/**'
      - 'scripts/build_appimage.sh'
      - 'scripts/build_deb.sh'
      - 'appimage.spec'
      - 'pyproject.toml'
      - '.github/workflows/build_linux.yml'

jobs:
  build-linux:
    name: Build Linux x86_64 (Ubuntu 14.04 LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare build tools & PyInstaller source
        run: |
          mkdir -p .cache/build

          # Fetch PyInstaller 3.3.1 and dependencies using host pip (guaranteed modern TLS)
          pip download --no-deps "pyinstaller==3.3.1" "future==0.16.0" "altgraph==0.15" "macholib==1.9" "pefile==2017.11.5" -d .cache/build/

          # Download official appimagetool release
          curl -fsSL -o .cache/build/appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x .cache/build/appimagetool-x86_64.AppImage

      - name: Build AppImage AppDir and DEB in Ubuntu 14.04 LTS Container
        run: |
          chmod +x scripts/build_linux_trusty.sh
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ubuntu:14.04 \
            bash scripts/build_linux_trusty.sh

      - name: Package AppImage on host
        run: |
          ARCH=x86_64 .cache/build/appimagetool-x86_64.AppImage --appimage-extract-and-run dist/Atlas.AppDir dist/Atlas-x86_64.AppImage

      - name: Verify release artifacts
        run: |
          ls -lh dist/
          test -f dist/Atlas-x86_64.AppImage
          test -f dist/Atlas-x86_64.deb

      - name: Upload Linux Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-Linux-x86_64
          path: |
            dist/Atlas-x86_64.AppImage
            dist/Atlas-x86_64.deb
          if-no-files-found: error
          retention-days: 14
